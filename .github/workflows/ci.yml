name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Test builds carry the last published version plus the run number, e.g. 2.0.0+70
      - id: version
        run: echo "name=$(node -p 'require("./package.json").version')+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: ./.github/actions/build-apk
        with:
          version-name: ${{ steps.version.outputs.name }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: monmoncafe-v${{ steps.version.outputs.name }}
          path: ${{ steps.build.outputs.apk }}
          retention-days: 30
